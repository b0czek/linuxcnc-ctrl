name: LinuxCNC patch tests

on:
  push:
    paths:
      - "linuxcnc-patches/**"
      - ".github/workflows/linuxcnc-patches.yml"
  pull_request:
    paths:
      - "linuxcnc-patches/**"
      - ".github/workflows/linuxcnc-patches.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linuxcnc-patches-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linuxcnc-tests:
    name: Patched LinuxCNC regression suite (${{ matrix.label }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1
          - shard: 1
            label: 2
          - shard: 2
            label: 3
          - shard: 3
            label: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test patch stack tooling
        run: ./linuxcnc-patches/test-stack.sh

      - name: Check out pinned LinuxCNC revision
        shell: bash
        env:
          LINUXCNC_DIR: ${{ runner.temp }}/linuxcnc
        run: |
          set -euo pipefail

          revision="$(< linuxcnc-patches/base-revision)"
          git init "${LINUXCNC_DIR}"
          git -C "${LINUXCNC_DIR}" remote add origin https://github.com/LinuxCNC/linuxcnc.git
          git -C "${LINUXCNC_DIR}" fetch --depth=1 origin "${revision}"
          git -C "${LINUXCNC_DIR}" checkout --detach FETCH_HEAD

      - name: Apply LinuxCNC patch series
        shell: bash
        env:
          LINUXCNC_DIR: ${{ runner.temp }}/linuxcnc
        run: |
          set -euo pipefail

          revision="$(< linuxcnc-patches/base-revision)"
          ./linuxcnc-patches/apply.sh --detach "${LINUXCNC_DIR}"

          patch_count="$(find linuxcnc-patches -maxdepth 1 -name '*.patch' | wc -l)"
          commit_count="$(git -C "${LINUXCNC_DIR}" rev-list --count "${revision}..HEAD")"
          test "${commit_count}" -eq "${patch_count}"
          test -z "$(git -C "${LINUXCNC_DIR}" status --porcelain --untracked-files=all)"

      - name: Install LinuxCNC build and test dependencies
        working-directory: ${{ runner.temp }}/linuxcnc
        run: .github/scripts/install-deps.sh

      - name: Build patched LinuxCNC
        working-directory: ${{ runner.temp }}/linuxcnc
        run: |
          mkdir -p "${RUNNER_TEMP}/rtlib-a" "${RUNNER_TEMP}/rtlib-b"
          .github/scripts/build-rip.sh \
            --with-realtime=uspace \
            --with-extra-rtlib-dirs="${RUNNER_TEMP}/rtlib-a:${RUNNER_TEMP}/rtlib-b"

      - name: Run LinuxCNC regression suite shard
        working-directory: ${{ runner.temp }}/linuxcnc
        env:
          SHARD_COUNT: ${{ strategy.job-total }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          # tests/resumable-stop/* are the longest tests (about 2.5 minutes
          # each); spread them one per shard. Everything else is hashed
          # across all shards.
          shard_tests=()
          resumable_index=0
          while IFS= read -r -d '' test_path; do
            if [[ "${test_path}" == tests/resumable-stop/* ]]; then
              test_shard=$((resumable_index % SHARD_COUNT))
              resumable_index=$((resumable_index + 1))
            else
              checksum="$(printf '%s' "${test_path}" | cksum)"
              checksum="${checksum%% *}"
              test_shard=$((checksum % SHARD_COUNT))
            fi
            if (( test_shard == SHARD_INDEX )); then
              shard_tests+=("${test_path}")
            fi
          done < <(
            find tests \( -name test -o -name test.sh -o -name test.hal \) \
              -print0 | sort -z
          )

          ((${#shard_tests[@]} > 0))
          echo "Running ${#shard_tests[@]} tests in shard $((SHARD_INDEX + 1))/${SHARD_COUNT}"
          scripts/rip-environment runtests -p "${shard_tests[@]}"
