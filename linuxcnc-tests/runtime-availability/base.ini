[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = core_sim.hal

[TRAJ]
NO_FORCE_HOMING = 0
AXES = 3
COORDINATES = XYZ
SPINDLES = 1
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50

[EMCIO]
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25

HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
[AXIS_Y]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
[AXIS_Z]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25
AVAILABILITY_CONTROL = 1
AVAILABILITY_TIMEOUT = 2
VOLATILE_HOME = 0
[JOINT_2]
TYPE = LINEAR
HOME = 0
HOME_SEARCH_VEL = 1
HOME_LATCH_VEL = 0.1
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25
AVAILABILITY_CONTROL = 1
AVAILABILITY_TIMEOUT = 2
VOLATILE_HOME = 1
[SPINDLE_0]
AVAILABILITY_CONTROL = 1
INITIAL_AVAILABILITY = 0
AVAILABILITY_TIMEOUT = 2
