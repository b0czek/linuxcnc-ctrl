[EMC]
VERSION = 1.1
MACHINE = homing-concurrent
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[EMCIO]
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = homing.hal

[TRAJ]
AXES = 7
COORDINATES = XYZUVWA
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50

[KINS]
KINEMATICS = trivkins coordinates=XYZUVWA
JOINTS = 7

[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500

[AXIS_Y]
