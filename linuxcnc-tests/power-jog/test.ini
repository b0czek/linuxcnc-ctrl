[EMC]
VERSION = 1.1
DEBUG = 0
[DISPLAY]
DISPLAY = ./test-ui.py
LATHE = 1
[RS274NGC]
PARAMETER_FILE = sim.var
[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4
SERVO_PERIOD = 1000000
[TASK]
TASK = milltask
CYCLE_TIME = 0.001
[HAL]
HALFILE = core_sim.hal
HALUI = halui
[TRAJ]
COORDINATES = XZ
SPINDLES = 2
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 5
MAX_LINEAR_VELOCITY = 30
MAX_LINEAR_JERK = 10000
[EMCIO]
TOOL_TABLE = tool.tbl
[KINS]
KINEMATICS = trivkins coordinates=XZ
JOINTS = 2
[AXIS_X]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 3
MAX_ACCELERATION = 15
MAX_JERK = 5000
[AXIS_Z]
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 10
MAX_ACCELERATION = 100
MAX_JERK = 10000
[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 3
MAX_ACCELERATION = 15
MAX_JERK = 5000
FERROR = 1
MIN_FERROR = 0.25
HOME = 0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -10
MAX_LIMIT = 10
MAX_VELOCITY = 10
MAX_ACCELERATION = 100
MAX_JERK = 10000
FERROR = 1
MIN_FERROR = 0.25
HOME = 0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
