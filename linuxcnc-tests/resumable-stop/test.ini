[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var
USER_M_PATH = .

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = core_sim.hal

[TRAJ]
NO_FORCE_HOMING = 1
AXES = 3
COORDINATES = X Y Z
SPINDLES = 2
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
PLANNER_TYPE = 1
ARC_BLEND_ENABLE = 1
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50
MAX_LINEAR_JERK = 5000

[EMCIO]
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000

[JOINT_0]
TYPE = LINEAR
# Home at the current position, then make a final move to HOME so that a
# queued G28.2 P0 takes long enough to be stopped part way.
HOME = 20
HOME_FINAL_VEL = 10
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25

[AXIS_Y]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000

[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25

[AXIS_Z]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000

[JOINT_2]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25
