[EMC]
VERSION = 1.1
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = core_sim.hal

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50

[KINS]
KINEMATICS = trivkins coordinates=XZ
JOINTS = 2

# X is deliberately slow: 0.5 mm/s is 30 mm/min.  Z allows 600 mm/min.
[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 0.5
MAX_ACCELERATION = 50

[JOINT_0]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 0.5
MAX_ACCELERATION = 50
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25

[AXIS_Z]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 10
MAX_ACCELERATION = 500

[JOINT_1]
TYPE = LINEAR
HOME = 0
MAX_VELOCITY = 10
MAX_ACCELERATION = 500
MIN_LIMIT = -100
MAX_LIMIT = 100
FERROR = 1
MIN_FERROR = 0.25
